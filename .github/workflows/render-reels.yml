# 手動実行: キュー内のリール動画を作り直し、確認用の画像と一緒にコミットする（公開はしない）
name: render-reels
on:
  workflow_dispatch:
    inputs:
      force:
        description: "既存の reel.mp4 も作り直す"
        default: "false"
permissions:
  contents: write
concurrency: instagram-ops
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      voicevox:
        image: voicevox/voicevox_engine:cpu-latest
        ports: ["50021:50021"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk ffmpeg
          pip install -q -r requirements.txt
      - name: Wait for VOICEVOX
        run: for i in $(seq 1 60); do curl -sf localhost:50021/version && break; sleep 2; done
      - name: Render reels
        run: |
          for d in content/queue/*/; do
            grep -q '"format": "reel"' "$d/post.json" || continue
            if [ "${{ inputs.force }}" = "true" ] || [ ! -f "$d/reel.mp4" ]; then
              python3 scripts/render_reel.py "$d"
              ffprobe -v error -show_entries format=duration:stream=codec_name,width,height -of compact "$d/reel.mp4"
              ffmpeg -v error -y -i "$d/reel.mp4" -vf "fps=1/3,scale=270:-1,tile=8x1" -frames:v 1 "$d/reel-frames.png"
            fi
          done
      - name: Render what-if experiments
        run: |
          for f in scripts/whatif/*.py; do
            name=$(basename "$f" .py)
            out=$(ls -d content/experiments/*-"${name//_/-}" 2>/dev/null | head -1)
            [ -n "$out" ] || continue
            python3 "$f" "$out"
            ffprobe -v error -show_entries format=duration -of compact "$out/reel.mp4"
            ffmpeg -v error -y -i "$out/reel.mp4" -vf "fps=1/3,scale=270:-1,tile=12x1" -frames:v 1 "$out/reel-frames.png"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: reels
          path: |
            content/queue/*/reel.mp4
            content/queue/*/reel-frames.png
            content/experiments/*/reel.mp4
      - name: Commit
        run: |
          git config user.name "autogram-bot"
          git config user.email "autogram-bot@users.noreply.github.com"
          git add -A && git diff --cached --quiet || git commit -m "reels: render $(date +%F)"
          git push
