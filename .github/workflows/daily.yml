# 毎日 20:00 JST: ネタ補充 → 審査 → 画像化 → 公開
name: daily-run
on:
  schedule:
    - cron: "0 11 * * *"   # 11:00 UTC = 20:00 JST
  workflow_dispatch:
permissions:
  contents: write
concurrency: instagram-ops
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      voicevox:   # ナレーション用の音声合成エンジン（無料・クレジット表記で商用可）
        image: voicevox/voicevox_engine:cpu-latest
        ports: ["50021:50021"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install deps & Japanese fonts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk ffmpeg
          pip install -q -r requirements.txt

      # AI社員たちがネタ補充・原稿・審査・画像化を行う（公開はしない）
      - name: AI company - produce content
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            /daily-run を実行してください。ただし手順3（公開）はスキップし、
            代わりに「公開はワークフローの次のステップで行う」と daily-log に記録してください。
          claude_args: >-
            --max-turns 60
            --allowedTools "Read,Write,Edit,Glob,Grep,WebSearch,WebFetch,Task,Bash(python3 scripts/*)"

      - name: Render any un-rendered approved posts (carousel / reel)
        run: |
          for d in content/queue/*/; do
            grep -q '"status": "ready"' "$d/post.json" || continue
            if grep -q '"format": "reel"' "$d/post.json"; then
              [ -f "$d/reel.mp4" ] || python3 scripts/render_reel.py "$d"
            elif ! ls "$d"slide-*.png >/dev/null 2>&1; then
              python3 scripts/render_carousel.py "$d"
            fi
          done

      # 画像を公開URLで配信するため、先にコミット＆プッシュする（raw.githubusercontent.com を利用）
      - name: Commit content
        run: |
          git config user.name "autogram-bot"
          git config user.email "autogram-bot@users.noreply.github.com"
          git add -A && git diff --cached --quiet || git commit -m "content: daily production $(date +%F)"
          git push
          sleep 20

      - name: Publish to Instagram
        if: vars.AUTO_PUBLISH != 'false'
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          MEDIA_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}
        run: python3 scripts/publish_instagram.py --max ${{ vars.POSTS_PER_RUN || 1 }}

      - name: Commit publish results
        if: always()
        run: |
          git add -A && git diff --cached --quiet || git commit -m "publish: results $(date +%F)"
          git push
