# 毎週月曜 9:00 JST: インサイト取得 → 分析 → 翌週方針
name: weekly-review
on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:
permissions:
  contents: write
concurrency: instagram-ops
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q -r requirements.txt
      - name: Fetch insights
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python3 scripts/fetch_insights.py
      - name: AI company - weekly review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: "/weekly-review を実行してください（インサイト取得は済んでいます）。"
          claude_args: >-
            --max-turns 40
            --allowedTools "Read,Write,Edit,Glob,Grep,Task,Bash(python3 scripts/*)"
      - name: Commit
        run: |
          git config user.name "autogram-bot"
          git config user.email "autogram-bot@users.noreply.github.com"
          git add -A && git diff --cached --quiet || git commit -m "weekly review $(date +%F)"
          git push
